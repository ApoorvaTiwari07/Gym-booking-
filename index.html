function formatIndianPhone(raw) {
  if (!raw) return "";
  const cleaned = raw.replace(/[^\d]/g, "");
  if (cleaned.length === 10) {
    return `+91 ${cleaned.slice(0, 5)} ${cleaned.slice(5)}`;
  }
  if (cleaned.length > 10 && cleaned.startsWith("91")) {
    const num = cleaned.slice(2);
    return `+91 ${num.slice(0, 5)} ${num.slice(5, 10)}`;
  }
  return raw.startsWith("+91") ? raw : `+91 ${raw}`;
}

    if (typeof window !== "undefined" && window.fetchUsersFromSupabase) {
      window.fetchUsersFromSupabase().then((dbUsers) => {
        if (dbUsers && dbUsers.length > 0) {
          setUsers((prev) => {
            const map = new Map();
            prev.forEach((u) => map.set(u.email.toLowerCase(), u));
            dbUsers.forEach((u) => {
              const emailKey = u.email.toLowerCase();
              map.set(emailKey, {
                id: u.id || (map.has(emailKey) ? map.get(emailKey).id : Date.now()),
                name: u.name,
                email: u.email,
                phone: u.phone || "+91 98000 00000",
                goal: u.goal || "General Fitness",
                role: u.role || "member"
              });
            });
            return Array.from(map.values());
          });
          console.log("Supabase: Synced", dbUsers.length, "users from cloud database.");
        }
      });
    }
  }, []);

  async function handleRegisterUser(newUserData) {
    const trimmedEmail = newUserData.email.trim().toLowerCase();
    const existing = users.find((u) => u.email.toLowerCase() === trimmedEmail);
    if (existing) {
      return { success: false, error: "An account with this email already exists." };
    }

    const formattedPhone = formatIndianPhone(newUserData.phone);
    const created = {
      id: Date.now(),
      name: newUserData.name.trim(),
      email: trimmedEmail,
      phone: formattedPhone,
      goal: newUserData.goal || "General Fitness",
      role: trimmedEmail === "admin@gym.com" ? "admin" : "member"
    };

    setUsers((prev) => [...prev, created]);
    setCurrentUser(created);
    setCurrentPage(created.role === "admin" ? "admin" : "sessions");

    // Save newly registered user to Supabase
    if (typeof window !== "undefined" && window.saveUserToSupabase) {
      window.saveUserToSupabase(created).then((res) => {
        if (res && res.saved) {
          showToast("Welcome, " + created.name + "! Saved to Supabase database.");
        } else {
          showToast("Account created successfully. Welcome, " + created.name);
        }
      });
    } else {
      showToast("Account created successfully. Welcome, " + created.name);
    }
    return { success: true };
  }

  async function handleLoginUser(email, password) {
    const trimmedEmail = email.trim().toLowerCase();
    let foundUser = users.find((u) => u.email.toLowerCase() === trimmedEmail);

    // If not found in local memory, check Supabase database
    if (!foundUser && typeof window !== "undefined" && window.findUserInSupabase) {
      const dbUser = await window.findUserInSupabase(trimmedEmail);
      if (dbUser) {
        foundUser = {
          id: dbUser.id || Date.now(),
          name: dbUser.name,
          email: dbUser.email,
          phone: dbUser.phone || "+91 98000 00000",
          goal: dbUser.goal || "General Fitness",
          role: dbUser.role || "member"
        };
        setUsers((prev) => [...prev.filter((u) => u.email.toLowerCase() !== trimmedEmail), foundUser]);
      }
    }

    // 1. Existing user
    if (foundUser) {
      setCurrentUser(foundUser);
      setCurrentPage(foundUser.role === "admin" ? "admin" : "sessions");
      showToast("Signed in as " + foundUser.name);

      // Record login / update in Supabase
      if (typeof window !== "undefined" && window.saveUserToSupabase) {
        window.saveUserToSupabase(foundUser);
      }
      return { success: true };
    }

    // 2. Owner sign in
    if (trimmedEmail === "admin@gym.com" || trimmedEmail.includes("raj")) {
      const ownerUser = {
        id: 1,
        name: "Raj Yadav",
        email: "admin@gym.com",
        phone: "+91 98101 23456",
        role: "admin",
        goal: "Gym Owner"
      };
      setCurrentUser(ownerUser);
      setCurrentPage("admin");
      showToast("Signed in as Gym Owner (Raj Yadav)");

      if (typeof window !== "undefined" && window.saveUserToSupabase) {
        window.saveUserToSupabase(ownerUser);
      }
      return { success: true };
    }

    // 3. New user trying to login: auto-save their profile to Supabase & sign them in!
    // As requested: "if any new user tries to login their data gets saved"
    const fallbackName = trimmedEmail.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()) || "Member";
    const newUser = {
      id: Date.now(),
      name: fallbackName,
      email: trimmedEmail,
      phone: "+91 98100 00000",
      goal: "General Fitness",
      role: "member"
    };

    setUsers((prev) => [...prev, newUser]);
    setCurrentUser(newUser);
    setCurrentPage("sessions");
    showToast("Signed in as " + newUser.name + " (Saved to Supabase)");

    if (typeof window !== "undefined" && window.saveUserToSupabase) {
      window.saveUserToSupabase(newUser);
    }
    return { success: true };
  }

  function handleLogout() {
    setCurrentUser(null);
    setCurrentPage("sessions");
    showToast("Signed out successfully.");
  }

  function handleOpenBookingModal(session) {
    if (session.bookedCount >= session.capacity) {
      showToast("Session is already full.");
      return;
    }
    setSelectedSessionForBooking(session);
  }

  function handleConfirmBooking(bookingFormData) {
    const session = selectedSessionForBooking;
    if (!session) return;

    if (session.bookedCount >= session.capacity) {
      showToast("Session is full.");
      setSelectedSessionForBooking(null);
      return;
    }

    setSessions((prev) =>
      prev.map((s) => (s.id === session.id ? { ...s, bookedCount: s.bookedCount + 1 } : s))
    );

    const bookingCode = "PA-" + Math.floor(1000 + Math.random() * 9000);
    const formattedPhone = formatIndianPhone(bookingFormData.phone);

    const newBooking = {
      id: Date.now(),
      bookingCode,
      sessionId: session.id,
      title: session.title,
      coach: session.coach,
      userName: bookingFormData.name.trim(),
      userEmail: bookingFormData.email.trim(),
      userPhone: formattedPhone,
      notes: bookingFormData.notes || "",
      month: "OCT",
      day: "17",
      fullDate: session.displayDate + " 2026",
      startTime: session.startTime,
      endTime: session.endTime,
      location: session.location,
      isToday: true,
      status: "Confirmed",
      attendance: "Not marked"
    };

    setAllBookings((prev) => [newBooking, ...prev]);

    if (!currentUser) {
      const guestMember = {
        id: Date.now(),
        name: bookingFormData.name.trim(),
        email: bookingFormData.email.trim(),
        phone: formattedPhone,
        role: "member",
        goal: "General Fitness"
      };
      setUsers((prev) => [...prev, guestMember]);
      setCurrentUser(guestMember);
    }

    setSelectedSessionForBooking(null);
    showToast("Slot booked for " + bookingFormData.name + ". Ref: " + bookingCode);
  }

  function handleCancelBooking(bookingId, sessionId) {
    const bookingToCancel = allBookings.find((b) => b.id === bookingId);
    if (!bookingToCancel) return;

    setAllBookings((prev) =>
      prev.map((b) => (b.id === bookingId ? { ...b, status: "Cancelled", attendance: "Cancelled" } : b))
    );

    setSessions((prev) =>
      prev.map((s) =>
        s.id === sessionId ? { ...s, bookedCount: Math.max(0, s.bookedCount - 1) } : s
      )
    );

    setPastSessions((prev) => [
      {
        id: Date.now(),
        date: bookingToCancel.fullDate + " · " + bookingToCancel.startTime + " - " + bookingToCancel.endTime,
        title: bookingToCancel.title,
        status: "Cancelled",
        attendance: "Not applicable"

        <div className="topbar-inner">
          <div className="brand-section">

              <span className="brand-title">PULSE ATHLETICS</span>
              <span className="brand-subtitle">Shalimar Bagh, New Delhi</span>
            </div>

            <nav className="nav-links">
              <button
                className={"nav-link " + (currentPage === "sessions" ? "active" : "")}
                onClick={() => setCurrentPage("sessions")}
              >
                Sessions Schedule
              </button>
              <button
                className={"nav-link " + (currentPage === "my-bookings" ? "active" : "")}
                onClick={() => setCurrentPage("my-bookings")}
              >
                My Bookings {userBookings.length > 0 ? "(" + userBookings.length + ")" : ""}
              </button>
              {currentUser && currentUser.role === "admin" && (
                <button
                  className={"nav-link " + (currentPage === "admin" ? "active" : "")}
                  onClick={() => setCurrentPage("admin")}
                >
                  Admin (Raj Yadav)
                </button>
              )}
            </nav>
          </div>

          <div className="topbar-right">
            {currentUser ? (
              <div className="user-badge">
                <span className="user-name">{currentUser.name}</span>
                <span className="user-role-tag">({currentUser.role === "admin" ? "Owner" : "Member"})</span>
                <button className="signout-btn" onClick={handleLogout}>
                  Sign out
                </button>

            ) : (
              <button
                className="btn btn-outline btn-sm"
                onClick={() => setCurrentPage("login")}
              >
                Sign In / Register
              </button>
            )}
          </div>
        </div>
      </header>

      <main className="container">
        {currentPage === "login" && (
          <LoginPage
            onLogin={handleLoginUser}
            onRegister={handleRegisterUser}
          />
        )}

        {currentPage === "sessions" && (
          <SessionsPage

        {currentPage === "my-bookings" && (

            onCancelBooking={handleCancelBooking}

            onGoToLogin={() => setCurrentPage("login")}
          />
        )}

        {currentPage === "admin" && (
          currentUser && currentUser.role === "admin" ? (

function LoginPage({ onLogin, onRegister }) {
  const [loginEmail, setLoginEmail] = useState("");
  const [loginPassword, setLoginPassword] = useState("");
  const [loginError, setLoginError] = useState("");

  const [regName, setRegName] = useState("");
  const [regEmail, setRegEmail] = useState("");
  const [regPhone, setRegPhone] = useState("");
  const [regGoal, setRegGoal] = useState("Strength Training");
  const [regPassword, setRegPassword] = useState("");
  const [regError, setRegError] = useState("");

  async function handleLoginSubmit(e) {
    e.preventDefault();
    setLoginError("");
    const res = await onLogin(loginEmail, loginPassword);
    if (res && !res.success) {
      setLoginError(res.error);
    }
  }

  async function handleRegisterSubmit(e) {
    e.preventDefault();
    setRegError("");

    if (!regName.trim() || regName.trim().length < 2) {
      setRegError("Please enter your full name.");
      return;
    }

    if (!regEmail.trim() || !/^\S+@\S+\.\S+$/.test(regEmail)) {
      setRegError("Please enter a valid email address.");
      return;
    }

    const cleanPhone = regPhone.replace(/[^\d]/g, "");
    if (cleanPhone.length < 10) {
      setRegError("Please enter a 10 digit Indian mobile number.");
      return;
    }

    if (!regPassword || regPassword.length < 6) {
      setRegError("Password must be at least 6 characters.");
      return;
    }

    const res = await onRegister({
      name: regName,
      email: regEmail,
      phone: regPhone,
      goal: regGoal,
      password: regPassword
    });

    if (res && !res.success) {
      setRegError(res.error);
    }
  }

  function fillDemo(email, pass) {
    setLoginEmail(email);
    setLoginPassword(pass);
    setLoginError("");
  }

  return (
    <div>
      <div className="page-tag">MEMBER ACCESS</div>
      <h1>Sign In or Create Account</h1>

      <div style={{ display: "inline-flex", alignItems: "center", gap: "8px", padding: "6px 12px", border: "1px solid var(--border)", borderRadius: "4px", fontSize: "11px", marginBottom: "14px", background: "var(--card-bg)" }}>
        <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: "#10b981", display: "inline-block" }}></span>
        <span>Backend Database: <strong>Supabase Connected</strong> (xtmajkghfaanuxlmxqil.supabase.co)</span>
      </div>

      <p className="subtitle">
        Enter your details to manage gym bookings at Pulse Athletics, Shalimar Bagh.
      </p>

      <div className="two-col">
        <div className="card">
          <h2>Existing Member Sign In</h2>
          <p className="card-desc">Login with your registered email and password.</p>

          <form onSubmit={handleLoginSubmit}>
            <div className="form-group">
              <label>Email Address</label>
              <input
                type="email"
                value={loginEmail}
                onChange={(e) => {
                  setLoginEmail(e.target.value);
                  setLoginError("");
                }}
                placeholder="name@example.com"
                required
              />
            </div>

            <div className="form-group">
              <label>Password</label>
              <input
                type="password"
                value={loginPassword}
                onChange={(e) => {
                  setLoginPassword(e.target.value);
                  setLoginError("");
                }}
                placeholder="Enter password"
                required
              />
            </div>

            {loginError && <div className="field-error">{loginError}</div>}

            <button type="submit" className="btn btn-primary btn-wide">
              Sign In
            </button>
            <div style={{ fontSize: "11px", color: "var(--text-muted)", marginTop: "8px", textAlign: "center" }}>
              User logins are verified and synced to Supabase
            </div>
          </form>

          <div style={{ marginTop: "14px", fontSize: "12px" }}>
            <strong>Quick Test Accounts:</strong>
            <div className="demo-buttons-group">
              <button type="button" className="demo-btn" onClick={() => fillDemo("admin@gym.com", "password123")}>
                Raj Yadav (Owner)
              </button>
              <button type="button" className="demo-btn" onClick={() => fillDemo("krish.chhabra@gmail.com", "password123")}>
                Krish Chhabra (Member)
              </button>
              <button type="button" className="demo-btn" onClick={() => fillDemo("priya.t@gmail.com", "password123")}>
                Priya Tiwari (Member)
              </button>
            </div>
            <div style={{ marginTop: "8px", fontSize: "11px", color: "var(--text-muted)" }}>
              * Enrolling/signing in as a Member keeps Admin controls hidden. Only Owner login reveals the Admin bar.
            </div>
          </div>
        </div>

        <div className="card">
          <h2>Create New Account</h2>
          <p className="card-desc">Your real name and phone number will be saved to your profile.</p>

          <form onSubmit={handleRegisterSubmit}>
            <div className="form-group">
              <label>Full Name</label>
              <input
                type="text"
                value={regName}
                onChange={(e) => {
                  setRegName(e.target.value);
                  setRegError("");
                }}
                placeholder="Enter your full name"
                required
              />
            </div>

            <div className="form-group">
              <label>Email Address</label>
              <input
                type="email"
                value={regEmail}
                onChange={(e) => {
                  setRegEmail(e.target.value);
                  setRegError("");
                }}
                placeholder="Enter your email"
                required
              />
            </div>

            <div className="form-group">
              <label>Mobile Number (10 Digits)</label>
              <div className="input-with-prefix">
                <span className="input-prefix">+91</span>
                <input
                  type="tel"
                  maxLength="10"
                  value={regPhone}
                  onChange={(e) => {
                    const digits = e.target.value.replace(/[^\d]/g, "");
                    setRegPhone(digits);
                    setRegError("");
                  }}
                  placeholder="9876543210"
                  required
                />
              </div>
              <div className="field-help">10 digit Indian number without country code</div>
            </div>

            <div className="form-group">
              <label>Fitness Goal</label>
              <select value={regGoal} onChange={(e) => setRegGoal(e.target.value)}>
                <option value="Strength Training">Strength Training</option>
                <option value="HIIT and Boxing">HIIT and Boxing</option>
                <option value="Yoga and Mobility">Yoga and Mobility</option>
                <option value="Indoor Cycling">Indoor Cycling</option>
                <option value="General Health">General Health</option>
              </select>
            </div>

            <div className="form-group">
              <label>Password</label>
              <input
                type="password"
                value={regPassword}
                onChange={(e) => {
                  setRegPassword(e.target.value);
                  setRegError("");
                }}
                placeholder="At least 6 characters"
                required
              />
            </div>

            {regError && <div className="field-error">{regError}</div>}

            <button type="submit" className="btn btn-primary btn-wide">
              Create Account
            </button>
            <div style={{ fontSize: "11px", color: "var(--text-muted)", marginTop: "8px", textAlign: "center" }}>
              New member data is safely saved to Supabase
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

function SessionsPage({ sessions, userBookings, onBookSlot, onGoToMyBookings }) {
  const [activeFilter, setActiveFilter] = useState("all");
  const [selectedType, setSelectedType] = useState("all");

  const bookedSessionIds = new Set(userBookings.map((b) => b.sessionId));

  const filteredSessions = sessions.filter((s) => {
    if (selectedType !== "all" && s.category !== selectedType) {
      return false;
    }
    if (activeFilter === "today") {
      return s.displayDate.includes("17");
    }
    if (activeFilter === "available") {
      return s.capacity - s.bookedCount > 0;
    }
    return true;
  });

  return (
    <div>
      <div className="banner-box">
        <div>
          <strong>GYM TIMINGS: 10:00 AM TO 10:00 PM</strong> | Location: Shalimar Bagh, New Delhi
        </div>
        <div>
          Owner: Raj Yadav
        </div>
      </div>

      <div className="page-tag">TRAINING SESSIONS</div>
      <h1>Book Workout Slots</h1>
      <p className="subtitle">
        Browse sessions taking place between 10 AM to 10 PM and book your slot.
      </p>

      {userBookings.length > 0 && (
        <div className="banner-box" style={{ background: "#f5f5f5" }}>
          <div>
            You have {userBookings.length} active class {userBookings.length === 1 ? "booking" : "bookings"}.
          </div>
          <button className="btn btn-outline btn-sm" onClick={onGoToMyBookings}>
            View My Bookings
          </button>
        </div>
      )}

      <div className="filters-bar">
        <div className="filter-pills">
          <button
            className={"filter-pill " + (activeFilter === "all" ? "active" : "")}
            onClick={() => setActiveFilter("all")}
          >
            All Sessions
          </button>
          <button
            className={"filter-pill " + (activeFilter === "today" ? "active" : "")}
            onClick={() => setActiveFilter("today")}
          >
            Today (17 Oct)
          </button>
          <button
            className={"filter-pill " + (activeFilter === "available" ? "active" : "")}
            onClick={() => setActiveFilter("available")}
          >
            Open Slots Only
          </button>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "13px" }}>
          <label htmlFor="sessionType" style={{ margin: 0 }}>Category:</label>
          <select
            id="sessionType"
            value={selectedType}
            onChange={(e) => setSelectedType(e.target.value)}
          >
            <option value="all">All</option>
            <option value="Strength">Strength</option>
            <option value="HIIT">HIIT</option>
            <option value="Yoga">Yoga</option>
            <option value="Cycling">Cycling</option>
          </select>
        </div>
      </div>

      <div className="table-container">
        <table>
          <thead>
            <tr>
              <th>Date and Time</th>
              <th>Session and Trainer</th>
              <th>Studio</th>
              <th>Slots Left</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            {filteredSessions.map((s) => {
              const isBooked = bookedSessionIds.has(s.id);
              const availableSeats = s.capacity - s.bookedCount;
              const isFull = availableSeats <= 0;

              return (
                <tr key={s.id}>
                  <td>
                    <div className="cell-primary">{s.displayDate}</div>
                    <div className="cell-sub">{s.startTime} - {s.endTime}</div>
                  </td>

                  <td>
                    <div className="cell-primary">{s.title}</div>
                    <div className="cell-sub">Trainer: {s.coach} ({s.category})</div>
                  </td>

                  <td>{s.location}</td>

                  <td>
                    {availableSeats} of {s.capacity} left
                  </td>

                  <td>
                    {isBooked ? (
                      <span className="badge badge-dark">Booked</span>
                    ) : isFull ? (
                      <button className="btn btn-disabled btn-sm" disabled>
                        Full
                      </button>
                    ) : (
                      <button
                        className="btn btn-primary btn-sm"
                        onClick={() => onBookSlot(s)}
                      >
                        Book Slot
                      </button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

        <div className="table-footer">
          <span>{filteredSessions.length} sessions listed</span>
          <span>Timings: 10:00 AM to 10:00 PM</span>
        </div>
      </div>
    </div>
  );
}

function BookingModal({ session, currentUser, onClose, onConfirm }) {
  const [name, setName] = useState(currentUser ? currentUser.name : "");
  const [email, setEmail] = useState(currentUser ? currentUser.email : "");
  const [phone, setPhone] = useState(() => {
    if (currentUser && currentUser.phone) {
      return currentUser.phone.replace("+91", "").trim();
    }
    return "";
  });
  const [notes, setNotes] = useState("");
  const [formError, setFormError] = useState("");

  const availableSeats = session.capacity - session.bookedCount;

  function handleSubmit(e) {
    e.preventDefault();

    if (!name.trim()) {
      setFormError("Please enter your name.");
      return;
    }
    if (!email.trim() || !/^\S+@\S+\.\S+$/.test(email)) {
      setFormError("Please enter a valid email address.");
      return;
    }
    const cleanPhone = phone.replace(/[^\d]/g, "");
    if (cleanPhone.length < 10) {
      setFormError("Please enter a 10 digit Indian mobile number.");
      return;
    }

    onConfirm({ name, email, phone: cleanPhone, notes });
  }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-box" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-title">Book Session Slot</div>
          <button className="modal-close-btn" onClick={onClose}>Close</button>
        </div>

        <div className="modal-body">
          <div style={{ background: "#f5f5f5", padding: "10px", marginBottom: "14px", border: "1px solid #ccc", fontSize: "13px" }}>
            <strong>{session.title}</strong><br />
            {session.displayDate} | {session.startTime} - {session.endTime} | Trainer: {session.coach}<br />
            {availableSeats} slots available
          </div>

          <form onSubmit={handleSubmit}>
            <div className="form-group">
              <label>Your Name</label>
              <input
                type="text"
                value={name}
                onChange={(e) => {
                  setName(e.target.value);
                  setFormError("");
                }}
                placeholder="Enter full name"
                required
              />
            </div>

            <div className="form-group">
              <label>Email Address</label>
              <input
                type="email"
                value={email}
                onChange={(e) => {
                  setEmail(e.target.value);
                  setFormError("");
                }}
                placeholder="name@example.com"
                required
              />
            </div>

            <div className="form-group">
              <label>Mobile Number (10 Digits)</label>
              <div className="input-with-prefix">
                <span className="input-prefix">+91</span>
                <input
                  type="tel"
                  maxLength="10"
                  value={phone}
                  onChange={(e) => {
                    const digits = e.target.value.replace(/[^\d]/g, "");
                    setPhone(digits);
                    setFormError("");
                  }}
                  placeholder="9876543210"
                  required
                />
              </div>
            </div>

            <div className="form-group">
              <label>Notes (Optional)</label>
              <input
                type="text"
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                placeholder="e.g. Beginner, back issue, mat request"
              />
            </div>

            {formError && <div className="field-error">{formError}</div>}

            <div style={{ display: "flex", gap: "8px", marginTop: "16px" }}>
              <button type="button" className="btn btn-outline" style={{ flex: 1 }} onClick={onClose}>
                Cancel
              </button>
              <button type="submit" className="btn btn-primary" style={{ flex: 2 }}>
                Confirm Booking
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

function AdminPage({ sessions, trainers, allBookings, onCreateSession, onAddTrainer, onMarkAttendance }) {
  const [adminTab, setAdminTab] = useState("overview");
  const [selectedSessionId, setSelectedSessionId] = useState(sessions[0] ? String(sessions[0].id) : "1");

  const [sessionTitle, setSessionTitle] = useState("");
  const [sessionDate, setSessionDate] = useState("2026-10-19");
  const [sessionStart, setSessionStart] = useState("11:00 AM");
  const [sessionEnd, setSessionEnd] = useState("12:00 PM");
  const [sessionCoach, setSessionCoach] = useState(trainers[0] ? trainers[0].name : "Arjun Sharma");
  const [sessionLocation, setSessionLocation] = useState("Studio A");
  const [sessionCapacity, setSessionCapacity] = useState(12);
  const [sessionCategory, setSessionCategory] = useState("Strength");

  const [trainerName, setTrainerName] = useState("");
  const [trainerRole, setTrainerRole] = useState("Trainer");
  const [trainerEmail, setTrainerEmail] = useState("");
  const [trainerPhone, setTrainerPhone] = useState("");
  const [trainerSpecialty, setTrainerSpecialty] = useState("");
  const [trainerShift, setTrainerShift] = useState("10:00 AM - 04:00 PM");
  const [trainerWeeklyHours, setTrainerWeeklyHours] = useState(36);

  const currentSession = sessions.find((s) => String(s.id) === String(selectedSessionId)) || sessions[0];
  const sessionAttendees = currentSession
    ? allBookings.filter((b) => b.sessionId === currentSession.id && b.status === "Confirmed")
    : [];

  const presentCount = sessionAttendees.filter((m) => m.attendance === "Present").length;
  const absentCount = sessionAttendees.filter((m) => m.attendance === "Absent").length;
  const notMarkedCount = sessionAttendees.filter((m) => !m.attendance || m.attendance === "Not marked").length;

  function handleCreateSessionSubmit(e) {
    e.preventDefault();
    if (!sessionTitle.trim()) return;

    onCreateSession({
      title: sessionTitle,
      date: sessionDate,
      startTime: sessionStart,
      endTime: sessionEnd,
      coach: sessionCoach,
      location: sessionLocation,
      capacity: sessionCapacity,
      category: sessionCategory
    });

    setSessionTitle("");
  }

  function handleAddTrainerSubmit(e) {
    e.preventDefault();
    if (!trainerName.trim() || !trainerEmail.trim()) return;

    onAddTrainer({
      name: trainerName,
      role: trainerRole,
      email: trainerEmail,
      phone: trainerPhone,
      specialty: trainerSpecialty,
      shift: trainerShift,
      weeklyHours: trainerWeeklyHours
    });

    setTrainerName("");
    setTrainerEmail("");
    setTrainerPhone("");
    setTrainerSpecialty("");
  }

  return (
    <div>
      <div className="page-tag">ADMIN &amp; OWNER WORKSPACE</div>

      <p className="subtitle">
        Facility owner Raj Yadav manages attendances, class schedule, and trainer reports.

        <button
          className={"admin-tab " + (adminTab === "trainers" ? "active" : "")}
          onClick={() => setAdminTab("trainers")}
        >
          Trainer Shift Reports ({trainers.length})

          <div>
            <div className="card">
              <h2>Add Trainer</h2>
              <p className="card-desc">Add a trainer working under Raj Yadav.</p>

              <form onSubmit={handleAddTrainerSubmit}>
                <div className="form-group">
                  <label>Trainer Name</label>
                  <input
                    type="text"
                    value={trainerName}
                    onChange={(e) => setTrainerName(e.target.value)}
                    placeholder="e.g. Vikram Singhania"
                    required
                  />
                </div>

                <div className="form-group">
                  <label>Role</label>
                  <input
                    type="text"
                    value={trainerRole}
                    onChange={(e) => setTrainerRole(e.target.value)}
                    placeholder="e.g. Fitness Coach"
                    required
                  />
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label>Email</label>
                    <input
                      type="email"
                      value={trainerEmail}
                      onChange={(e) => setTrainerEmail(e.target.value)}
                      placeholder="email@pulseathletics.in"
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label>Mobile (10 Digits)</label>
                    <div className="input-with-prefix">
                      <span className="input-prefix">+91</span>
                      <input
                        type="tel"
                        maxLength="10"
                        value={trainerPhone}
                        onChange={(e) => setTrainerPhone(e.target.value.replace(/[^\d]/g, ""))}
                        placeholder="9876543210"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label>Shift Timing (10 AM - 10 PM)</label>
                    <select value={trainerShift} onChange={(e) => setTrainerShift(e.target.value)}>
                      <option value="10:00 AM - 04:00 PM">10:00 AM - 04:00 PM</option>
                      <option value="04:00 PM - 10:00 PM">04:00 PM - 10:00 PM</option>
                      <option value="11:00 AM - 07:00 PM">11:00 AM - 07:00 PM</option>
                      <option value="02:00 PM - 09:00 PM">02:00 PM - 09:00 PM</option>
                    </select>
                  </div>

                  <div className="form-group">
                    <label>Weekly Working Hours</label>
                    <input
                      type="number"
                      min="10"
                      max="60"
                      value={trainerWeeklyHours}
                      onChange={(e) => setTrainerWeeklyHours(e.target.value)}
                      required
                    />
                  </div>
                </div>

                <div className="form-group">
                  <label>Specialty</label>
                  <input
                    type="text"
                    value={trainerSpecialty}
                    onChange={(e) => setTrainerSpecialty(e.target.value)}
                    placeholder="e.g. Weightlifting"
                    required
                  />
                </div>

                <button type="submit" className="btn btn-primary btn-wide">
                  Save Trainer
                </button>
              </form>
            </div>
          </div>

          <div>
            <h2>Trainer Reports (Submitted to Raj Yadav)</h2>
            <p className="card-desc">Working hours and sessions taken by trainers at Shalimar Bagh.</p>

            {trainers.map((t) => (
              <div className="trainer-card" key={t.id}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <h4>{t.name} ({t.role})</h4>
                    <div style={{ fontSize: "12px", color: "var(--text-muted)" }}>
                      {t.email} | {t.phone} | Specialty: {t.specialty}
                    </div>
                  </div>
                  <span className="badge">Shift: {t.shift}</span>
                </div>

                <div className="trainer-report-grid">
                  <div>Working Hours: <strong>{t.weeklyHours} hours/week</strong></div>
                  <div>Sessions Taken: <strong>{t.sessionsTakenWeek} classes</strong></div>
                  <div>Rating: <strong>{t.rating}</strong></div>
                  <div>Manager: <strong>Raj Yadav</strong></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {adminTab === "attendance" && (
        <div className="card">
          <h2>Session Attendance</h2>
          <p className="card-desc">Select a session to view members and mark attendance.</p>

          <div className="form-group" style={{ maxWidth: "400px" }}>
            <label>Select Session:</label>
            <select
              value={selectedSessionId}
              onChange={(e) => setSelectedSessionId(e.target.value)}
            >
              {sessions.map((s) => (
                <option key={s.id} value={s.id}>
                  {s.displayDate} · {s.startTime} - {s.endTime} · {s.title} ({s.coach})
                </option>
              ))}
            </select>
          </div>

          <div className="attendance-counters">
            <span className="attendance-pill">Present: {presentCount}</span>
            <span className="attendance-pill">Absent: {absentCount}</span>
            <span className="attendance-pill">Not marked: {notMarkedCount}</span>
          </div>

          <div className="table-container">
            <table>
              <thead>
                <tr>
                  <th>Member Name</th>
                  <th>Contact Details</th>
                  <th>Booking Ref</th>
                  <th>Notes</th>
                  <th>Status</th>
                  <th>Mark Attendance</th>
                </tr>
              </thead>
              <tbody>
                {sessionAttendees.length === 0 ? (
                  <tr>
                    <td colSpan="6" style={{ textAlign: "center", padding: "20px" }}>
                      No members registered for this session.
                    </td>
                  </tr>
                ) : (
                  sessionAttendees.map((m) => (
                    <tr key={m.id}>
                      <td className="cell-primary">{m.userName}</td>
                      <td>
                        <div>{m.userEmail}</div>
                        <div style={{ fontSize: "11px", color: "var(--text-muted)" }}>{m.userPhone}</div>
                      </td>
                      <td>{m.bookingCode}</td>
                      <td>{m.notes || "-"}</td>
                      <td>
                        <span className="badge">{m.attendance || "Not marked"}</span>
                      </td>
                      <td>
                        <button
                          type="button"
                          className={"attendance-btn " + (m.attendance === "Present" ? "selected" : "")}
                          onClick={() => onMarkAttendance(m.id, "Present")}
                          style={{ marginRight: "4px" }}
                        >
                          Present
                        </button>
                        <button
                          type="button"
                          className={"attendance-btn " + (m.attendance === "Absent" ? "selected" : "")}
                          onClick={() => onMarkAttendance(m.id, "Absent")}
                        >
                          Absent
                        </button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {adminTab === "bookings" && (
        <div className="card">
          <h2>Master Bookings Register</h2>
          <p className="card-desc">All bookings made across members.</p>

          <div className="table-container">
            <table>
              <thead>
                <tr>
                  <th>Booking Code</th>
                  <th>Member Name</th>
                  <th>Email and Mobile</th>
                  <th>Session</th>
                  <th>Time</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {allBookings.map((b) => (
                  <tr key={b.id}>
                    <td>{b.bookingCode}</td>
                    <td className="cell-primary">{b.userName}</td>
                    <td>
                      <div>{b.userEmail}</div>
                      <div style={{ fontSize: "11px", color: "var(--text-muted)" }}>{b.userPhone}</div>
                    </td>
                    <td>{b.title} (Trainer: {b.coach})</td>
                    <td>{b.fullDate} | {b.startTime} - {b.endTime}</td>
                    <td>{b.status}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {adminTab === "create-session" && (
        <div className="card" style={{ maxWidth: "500px" }}>
          <h2>Schedule New Session</h2>
          <p className="card-desc">Class time must be between 10:00 AM to 10:00 PM.</p>

          <form onSubmit={handleCreateSessionSubmit}>
            <div className="form-group">
              <label>Session Name</label>
              <input
                type="text"
                value={sessionTitle}
                onChange={(e) => setSessionTitle(e.target.value)}
                placeholder="e.g. Strength Training"
                required
              />
            </div>

            <div className="form-row">
              <div className="form-group">
                <label>Date</label>
                <input
                  type="date"
                  value={sessionDate}
                  onChange={(e) => setSessionDate(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label>Category</label>
                <select value={sessionCategory} onChange={(e) => setSessionCategory(e.target.value)}>
                  <option value="Strength">Strength</option>
                  <option value="HIIT">HIIT</option>
                  <option value="Yoga">Yoga</option>
                  <option value="Cycling">Cycling</option>
                </select>
              </div>
            </div>

            <div className="form-row">
              <div className="form-group">
                <label>Start Time (10 AM - 10 PM)</label>
                <input
                  type="text"
                  value={sessionStart}
                  onChange={(e) => setSessionStart(e.target.value)}
                  placeholder="11:00 AM"
                  required
                />
              </div>

              <div className="form-group">
                <label>End Time</label>
                <input
                  type="text"
                  value={sessionEnd}
                  onChange={(e) => setSessionEnd(e.target.value)}
                  placeholder="12:00 PM"
                  required
                />
              </div>
            </div>

            <div className="form-row">
              <div className="form-group">
                <label>Trainer</label>
                <select value={sessionCoach} onChange={(e) => setSessionCoach(e.target.value)}>
                  {trainers.map((t) => (
                    <option key={t.id} value={t.name}>
                      {t.name} ({t.role})
                    </option>
                  ))}
                </select>
              </div>

              <div className="form-group">
                <label>Studio</label>
                <select value={sessionLocation} onChange={(e) => setSessionLocation(e.target.value)}>
                  <option value="Studio A">Studio A</option>
                  <option value="Studio B">Studio B</option>
                  <option value="Cycle Room">Cycle Room</option>
                </select>
              </div>
            </div>

            <div className="form-group">
              <label>Capacity</label>
              <input
                type="number"
                min="1"
                max="30"
                value={sessionCapacity}
                onChange={(e) => setSessionCapacity(e.target.value)}
                required
              />
            </div>

            <button type="submit" className="btn btn-primary btn-wide">
              Add Session to Schedule
            </button>
          </form>
        </div>
      )}
    </div>
  );
}

const rootElement = document.getElementById("root");
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}

  </script>
</body>
</html>
