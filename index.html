function App() {
  const [currentPage, setCurrentPage] = useState("sessions");

  const [users, setUsers] = useState(() => {
    const saved = localStorage.getItem("pulse_users");
    return saved ? JSON.parse(saved) : INITIAL_USERS;
  });

  const [currentUser, setCurrentUser] = useState(() => {
    const saved = localStorage.getItem("pulse_user");
    return saved ? JSON.parse(saved) : null;
  });

  const [sessions, setSessions] = useState(() => {
    const saved = localStorage.getItem("pulse_sessions");
    return saved ? JSON.parse(saved) : INITIAL_SESSIONS;
  });

  const [trainers, setTrainers] = useState(() => {
    const saved = localStorage.getItem("pulse_trainers");
    return saved ? JSON.parse(saved) : INITIAL_TRAINERS;
  });

  const [allBookings, setAllBookings] = useState(() => {
    const saved = localStorage.getItem("pulse_all_bookings");
    return saved ? JSON.parse(saved) : INITIAL_ALL_BOOKINGS;
  });

  const [pastSessions, setPastSessions] = useState(() => {
    const saved = localStorage.getItem("pulse_past");
    return saved ? JSON.parse(saved) : INITIAL_PAST_SESSIONS;
  });

  const [selectedSessionForBooking, setSelectedSessionForBooking] = useState(null);
  const [toasts, setToasts] = useState([]);

  useEffect(() => {
    if (currentUser) {
      localStorage.setItem("pulse_user", JSON.stringify(currentUser));
    } else {
      localStorage.removeItem("pulse_user");
    }
  }, [currentUser]);

  useEffect(() => {
    localStorage.setItem("pulse_users", JSON.stringify(users));
  }, [users]);

  useEffect(() => {
    localStorage.setItem("pulse_sessions", JSON.stringify(sessions));
  }, [sessions]);

  useEffect(() => {
    localStorage.setItem("pulse_trainers", JSON.stringify(trainers));
  }, [trainers]);

  useEffect(() => {
    localStorage.setItem("pulse_all_bookings", JSON.stringify(allBookings));
  }, [allBookings]);

  useEffect(() => {
    localStorage.setItem("pulse_past", JSON.stringify(pastSessions));
  }, [pastSessions]);

  function showToast(message, type = "success") {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts((prev) => prev.filter((t) => t.id !== id));
    }, 4000);
  }

  function handleRegisterUser(newUser) {
    const existing = users.find((u) => u.email.toLowerCase() === newUser.email.toLowerCase());
    if (existing) {
      return { success: false, error: "An account with this email already exists." };
    }

    const created = {
      id: Date.now(),
      name: newUser.name.trim(),
      email: newUser.email.trim(),
      phone: newUser.phone.trim(),
      goal: newUser.goal || "General Fitness",
      role: newUser.email.toLowerCase().includes("admin") ? "admin" : "member"
    };

    setUsers((prev) => [...prev, created]);
    setCurrentUser(created);
    setCurrentPage(created.role === "admin" ? "admin" : "sessions");
    showToast(`Welcome, ${created.name}! Your account is now active.`);
    return { success: true };
  }

  function handleLoginUser(email, password) {
    const trimmedEmail = email.trim().toLowerCase();
    const foundUser = users.find((u) => u.email.toLowerCase() === trimmedEmail);

    if (foundUser) {
      setCurrentUser(foundUser);
      setCurrentPage(foundUser.role === "admin" ? "admin" : "sessions");
      showToast(`Welcome back, ${foundUser.name}!`);
      return { success: true };
    }

    if (trimmedEmail.includes("admin")) {
      const adminUser = {
        id: 3,
        name: "Marcus Vance",
        email: email,
        phone: "+1 (555) 782-9011",
        role: "admin",
        goal: "Owner / Director"
      };
      setCurrentUser(adminUser);
      setCurrentPage("admin");
      showToast("Logged in to Gym Owner Dashboard.");
      return { success: true };
    }

    return { success: false, error: "Account not found. Please check your email or register." };
  }

  function handleLogout() {
    setCurrentUser(null);
    setCurrentPage("sessions");
    showToast("You have been signed out.");
  }

  function handleOpenBookingModal(session) {
    if (session.bookedCount >= session.capacity) {
      showToast("This session has reached full capacity.", "error");
      return;
    }
    setSelectedSessionForBooking(session);
  }

  function handleConfirmBooking(bookingFormData) {
    const session = selectedSessionForBooking;
    if (!session) return;

    if (session.bookedCount >= session.capacity) {
      showToast("Session is already full.", "error");
      setSelectedSessionForBooking(null);
      return;
    }

    setSessions((prev) =>
      prev.map((s) => (s.id === session.id ? { ...s, bookedCount: s.bookedCount + 1 } : s))
    );

    const bookingCode = `PL-${Math.floor(1000 + Math.random() * 9000)}`;
    const newBooking = {
      id: Date.now(),
      bookingCode,
      sessionId: session.id,
      title: session.title,
      coach: session.coach,
      userName: bookingFormData.name.trim(),
      userEmail: bookingFormData.email.trim(),
      userPhone: bookingFormData.phone.trim(),
      notes: bookingFormData.notes || "",
      month: session.displayDate.split(" ")[2] ? session.displayDate.split(" ")[2].toUpperCase() : "OCT",
      day: session.displayDate.split(" ")[1] || "18",
      fullDate: `${session.displayDate} 2026`,
      startTime: session.startTime,
      endTime: session.endTime,
      location: session.location,
      isToday: session.displayDate.includes("16"),
      status: "Confirmed",
      attendance: "Not marked"
    };

    setAllBookings((prev) => [newBooking, ...prev]);

    if (!currentUser) {
      const guestMember = {
        id: Date.now(),
        name: bookingFormData.name.trim(),
        email: bookingFormData.email.trim(),
        phone: bookingFormData.phone.trim(),
        role: "member",
        goal: "General Fitness"
      };
      setUsers((prev) => [...prev, guestMember]);
      setCurrentUser(guestMember);
    }

    setSelectedSessionForBooking(null);
    showToast(`Slot reserved! Booking Ref: ${bookingCode}`);
  }

  function handleCancelBooking(bookingId, sessionId) {
    const bookingToCancel = allBookings.find((b) => b.id === bookingId);
    if (!bookingToCancel) return;

    setAllBookings((prev) =>
      prev.map((b) => (b.id === bookingId ? { ...b, status: "Cancelled", attendance: "Cancelled" } : b))
    );

    setSessions((prev) =>
      prev.map((s) =>
        s.id === sessionId ? { ...s, bookedCount: Math.max(0, s.bookedCount - 1) } : s
      )
    );

    setPastSessions((prev) => [
      {
        id: Date.now(),
        date: `${bookingToCancel.fullDate} · ${bookingToCancel.startTime}-${bookingToCancel.endTime}`,
        title: bookingToCancel.title,
        status: "Cancelled",
        attendance: "Not applicable"
      },
      ...prev
    ]);

    showToast("Booking cancelled. The slot has been released.");
  }

  function handleCreateSession(sessionData) {
    const newSession = {
      id: Date.now(),
      title: sessionData.title.trim(),
      date: sessionData.date,
      displayDate: formatDisplayDate(sessionData.date),
      startTime: sessionData.startTime,
      endTime: sessionData.endTime,
      coach: sessionData.coach,
      location: sessionData.location,
      capacity: Number(sessionData.capacity),
      bookedCount: 0,
      category: sessionData.category
    };

    setSessions((prev) => [newSession, ...prev]);
    showToast(`Session "${newSession.title}" published to schedule!`);
  }

  function handleAddTrainer(newTrainerData) {
    const newTrainer = {
      id: Date.now(),
      name: newTrainerData.name.trim(),
      role: newTrainerData.role.trim() || "Trainer & Coach",
      email: newTrainerData.email.trim(),
      phone: newTrainerData.phone.trim(),
      specialty: newTrainerData.specialty.trim(),
      certifications: newTrainerData.certifications.trim(),
      bio: newTrainerData.bio.trim() || "Certified fitness professional dedicated to client progress.",
      activeSessions: 0
    };

    setTrainers((prev) => [...prev, newTrainer]);
    showToast(`Coach ${newTrainer.name} added to staff roster!`);
  }

  function handleMarkAttendance(bookingId, status) {
    setAllBookings((prev) =>
      prev.map((b) => (b.id === bookingId ? { ...b, attendance: status } : b))
    );
  }

  const userBookings = currentUser
    ? allBookings.filter(
        (b) =>
          b.userEmail.toLowerCase() === currentUser.email.toLowerCase() &&
          b.status === "Confirmed"
      )
    : [];

  return (
    <div>
      <Navigation
        currentUser={currentUser}
        currentPage={currentPage}
        setCurrentPage={setCurrentPage}
        onLogout={handleLogout}
        myBookingsCount={userBookings.length}
      />

      <main className="container">
        {currentPage === "login" && (
          <LoginPage
            onLogin={handleLoginUser}
            onRegister={handleRegisterUser}
            onSwitchToSessions={() => setCurrentPage("sessions")}
          />
        )}

        {currentPage === "sessions" && (
          <SessionsPage
            sessions={sessions}
            userBookings={userBookings}
            onBookSlot={handleOpenBookingModal}
            onGoToMyBookings={() => setCurrentPage("my-bookings")}
          />
        )}

        {currentPage === "my-bookings" && (
          <MyBookingsPage
            currentUser={currentUser}
            userBookings={userBookings}
            pastSessions={pastSessions}
            onCancelBooking={handleCancelBooking}
            onBrowseSessions={() => setCurrentPage("sessions")}
            onGoToLogin={() => setCurrentPage("login")}
          />
        )}

        {currentPage === "admin" && (
          <AdminPage
            sessions={sessions}
            trainers={trainers}
            allBookings={allBookings}
            onCreateSession={handleCreateSession}
            onAddTrainer={handleAddTrainer}
            onMarkAttendance={handleMarkAttendance}
          />
        )}
      </main>

      {selectedSessionForBooking && (
        <BookingModal
          session={selectedSessionForBooking}
          currentUser={currentUser}
          onClose={() => setSelectedSessionForBooking(null)}
          onConfirm={handleConfirmBooking}
        />
      )}

      <div className="toast-container">
        {toasts.map((t) => (
          <div key={t.id} className={`toast toast-${t.type}`}>
            <span>{t.type === "success" ? "✓" : "⚠"}</span>
            <span>{t.message}</span>
          </div>
        ))}
      </div>

      <Footer />
    </div>
  );
}

function Navigation({ currentUser, currentPage, setCurrentPage, onLogout, myBookingsCount }) {
  const initials = currentUser
    ? currentUser.name
        .split(" ")
        .map((p) => p[0])
        .slice(0, 2)
        .join("")
        .toUpperCase()
    : "";

  return (
    <header className="topbar">
      <div className="topbar-inner">
        <div className="brand-section">
          <div className="logo" onClick={() => setCurrentPage("sessions")}>
            <span className="brand-title">PULSE ATHLETICS</span>
            <span className="brand-subtitle">Fitness Club & Studios</span>
          </div>

          <nav className="nav-links">
            <button
              className={`nav-link ${currentPage === "sessions" ? "active" : ""}`}
              onClick={() => setCurrentPage("sessions")}
            >
              Sessions
            </button>
            <button
              className={`nav-link ${currentPage === "my-bookings" ? "active" : ""}`}
              onClick={() => setCurrentPage("my-bookings")}
            >
              My Bookings {myBookingsCount > 0 && `(${myBookingsCount})`}
            </button>
            <button
              className={`nav-link ${currentPage === "admin" ? "active" : ""}`}
              onClick={() => setCurrentPage("admin")}
            >
              Admin & Owner
            </button>
          </nav>
        </div>

        <div className="topbar-right">
          {currentUser ? (
            <div className="user-badge">
              <span className="avatar-circle">{initials}</span>
              <div className="user-meta">
                <span className="user-name">{currentUser.name}</span>
                <span className="user-role-tag">{currentUser.role}</span>
              </div>
              <button className="signout-btn" onClick={onLogout}>
                Sign out
              </button>
            </div>
          ) : (
            <button
              className="btn btn-outline btn-sm"
              onClick={() => setCurrentPage("login")}
            >
              Member Sign in
            </button>
          )}
        </div>
      </div>
    </header>
  );
}

function LoginPage({ onLogin, onRegister, onSwitchToSessions }) {
  const [loginEmail, setLoginEmail] = useState("");
  const [loginPassword, setLoginPassword] = useState("");
  const [loginError, setLoginError] = useState("");

  const [regName, setRegName] = useState("");
  const [regEmail, setRegEmail] = useState("");
  const [regPhone, setRegPhone] = useState("");
  const [regGoal, setRegGoal] = useState("Strength & Muscle");

function SessionsPage({ sessions, userBookings, onBookSlot, onGoToMyBookings }) {
  const [activeFilter, setActiveFilter] = useState("all");
  const [selectedType, setSelectedType] = useState("all");

  const bookedSessionIds = new Set(userBookings.map((b) => b.sessionId));

  const filteredSessions = sessions.filter((s) => {
    if (selectedType !== "all" && s.category !== selectedType) {
      return false;
    }
    if (activeFilter === "today") {
      return s.displayDate.includes("16");
    }
    if (activeFilter === "available") {
      return s.capacity - s.bookedCount > 0;
    }
    return true;
  });

  return (
    <div>
      <div className="page-tag">TRAINING SCHEDULE</div>
      <h1>Book Training Slots</h1>
      <p className="subtitle">
        Reserve spots in upcoming studio classes. Real-time availability updated per session.
      </p>

      {userBookings.length > 0 && (
        <div className="alert-banner">
          <div className="alert-message">
            <span>✓</span>
            <span>You have {userBookings.length} confirmed upcoming {userBookings.length === 1 ? "booking" : "bookings"}.</span>
          </div>
          <button className="alert-link" onClick={onGoToMyBookings}>
            View my schedule →
          </button>
        </div>
      )}

      <div className="filters-bar">
        <div className="filter-pills">
          <button
            className={`filter-pill ${activeFilter === "all" ? "active" : ""}`}
            onClick={() => setActiveFilter("all")}
          >
            All Dates
          </button>
          <button
            className={`filter-pill ${activeFilter === "today" ? "active" : ""}`}
            onClick={() => setActiveFilter("today")}
          >
            Today's Classes
          </button>
          <button
            className={`filter-pill ${activeFilter === "available" ? "active" : ""}`}
            onClick={() => setActiveFilter("available")}
          >
            Open Slots Only
          </button>
        </div>

        <div className="filter-type">
          <label htmlFor="sessionType" style={{ margin: 0 }}>Category:</label>
          <select
            id="sessionType"
            value={selectedType}
            onChange={(e) => setSelectedType(e.target.value)}
          >
            <option value="all">All Disciplines</option>
            <option value="Strength">Strength</option>
            <option value="HIIT">HIIT</option>
            <option value="Yoga">Yoga</option>
            <option value="Cycling">Cycling</option>
            <option value="Recovery">Recovery</option>
          </select>
        </div>
      </div>

      <div className="table-container">
        <table>
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Class & Coach</th>
              <th>Studio Room</th>
              <th>Capacity</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            {filteredSessions.map((s) => {
              const isBooked = bookedSessionIds.has(s.id);
              const availableSeats = s.capacity - s.bookedCount;
              const isFull = availableSeats <= 0;

              return (
                <tr key={s.id}>
                  <td>
                    <div className="cell-primary">{s.displayDate}</div>
                    <div className="cell-sub">{s.startTime} - {s.endTime}</div>
                  </td>

                  <td>
                    <div className="cell-primary">{s.title}</div>
                    <div className="cell-sub">Coach {s.coach} · {s.category}</div>
                  </td>

                  <td>
                    <span className="badge badge-outline">{s.location}</span>
                  </td>

                  <td>
                    <div className="cell-primary">
                      {availableSeats} / {s.capacity} spots left
                    </div>
                    <div className="cell-sub">{s.bookedCount} confirmed</div>
                  </td>

                  <td>
                    {isBooked ? (
                      <span className="badge badge-green">✓ Reserved</span>
                    ) : isFull ? (
                      <button className="btn btn-disabled" disabled>
                        Class Full
                      </button>
                    ) : (
                      <button
                        className="btn btn-primary btn-sm"
                        onClick={() => onBookSlot(s)}
                      >
                        Book Slot
                      </button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

        <div className="table-footer">
          <span>{filteredSessions.length} sessions listed</span>
          <span>Reservations require attendee contact info for gym access.</span>
        </div>
      </div>
    </div>
  );
}

function BookingModal({ session, currentUser, onClose, onConfirm }) {
  const [name, setName] = useState(currentUser ? currentUser.name : "");

  const [phone, setPhone] = useState(currentUser && currentUser.phone ? currentUser.phone : "");

  const [formError, setFormError] = useState("");

  function handleSubmit(e) {
    e.preventDefault();

    if (!name.trim()) {
      setFormError("Please enter your name.");
      return;
    }
    if (!email.trim() || !/^\S+@\S+\.\S+$/.test(email)) {
      setFormError("Please enter a valid email address.");
      return;

    if (!phone.trim()) {
      setFormError("Please enter your phone number.");
      return;

            <div style={{ fontSize: "11px", color: "var(--primary)", marginTop: "4px", fontWeight: 600 }}>
              {availableSeats} slots remaining

          </div>

          <form onSubmit={handleSubmit}>
            <div className="form-group">
              <label>Attendee Full Name</label>
              <input
                type="text"
                value={name}
                onChange={(e) => {

                />

              <div className="form-group">
                <label>Phone Number</label>
                <input
                  type="tel"

                  onChange={(e) => {
                    setPhone(e.target.value);
                    setFormError("");
                  }}

            <div className="form-group">

                  </div>
                  <div className="trainer-body">{t.bio}</div>
                </div>
                <div className="trainer-meta-row">
                  <span>{t.certifications}</span>
                  <span className="badge badge-teal">Active</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {adminTab === "trainers" && (
        <div className="admin-grid">
          <div>
            <div className="card">
              <h2>Add New Trainer to Roster</h2>
              <p className="card-desc">Enter coach credentials. They will become selectable for class scheduling.</p>

              <form onSubmit={handleAddTrainerSubmit}>
                <div className="form-group">
                  <label>Coach Full Name</label>
                  <input
                    type="text"
                    value={trainerName}
                    onChange={(e) => setTrainerName(e.target.value)}
                    placeholder="e.g. Elena Rostova"
                    required
                  />
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label>Email Address</label>
                    <input
                      type="email"
                      value={trainerEmail}
                      onChange={(e) => setTrainerEmail(e.target.value)}
                      placeholder="elena@pulseathletics.com"
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label>Phone Number</label>
                    <input
                      type="tel"
                      value={trainerPhone}
                      onChange={(e) => setTrainerPhone(e.target.value)}
                      placeholder="+1 (555) 000-0000"
                    />
                  </div>
                </div>

                <div className="form-group">
                  <label>Discipline / Specialty</label>
                  <input
                    type="text"
                    value={trainerSpecialty}
                    onChange={(e) => setTrainerSpecialty(e.target.value)}
                    placeholder="e.g. Olympic Weightlifting & Hypertrophy"
                    required
                  />
                </div>

                <div className="form-group">
                  <label>Certifications</label>
                  <input
                    type="text"
                    value={trainerCerts}
                    onChange={(e) => setTrainerCerts(e.target.value)}
                    placeholder="e.g. CSCS, USAW L2, NASM-CPT"
                    required
                  />
                </div>

                <div className="form-group">
                  <label>Coach Biography</label>
                  <textarea
                    rows="3"
                    value={trainerBio}
                    onChange={(e) => setTrainerBio(e.target.value)}
                    placeholder="Brief background, athlete history, or training approach..."
                  ></textarea>
                </div>

                <button type="submit" className="btn btn-primary btn-wide">
                  Add Coach to Staff Roster
                </button>
              </form>
            </div>
          </div>

          <div>
            <h2>Current Coaching Staff ({trainers.length})</h2>
            <p className="card-desc">Certified instructors assigned to studio classes.</p>

            <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
              {trainers.map((t) => (
                <div className="card" key={t.id} style={{ marginBottom: 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div style={{ display: "flex", gap: "14px", alignItems: "center" }}>
                      <div className="trainer-avatar" style={{ width: "48px", height: "48px", fontSize: "16px" }}>
                        {t.name.split(" ").map((n) => n[0]).join("")}
                      </div>
                      <div>
                        <h3>{t.name}</h3>
                        <div style={{ fontSize: "12px", color: "var(--primary)", fontWeight: 600 }}>
                          {t.specialty}
                        </div>
                        <div style={{ fontSize: "12px", color: "var(--text-muted)" }}>
                          {t.email} · {t.phone}
                        </div>
                      </div>
                    </div>
                    <span className="badge badge-teal">{t.certifications}</span>
                  </div>
                  <p style={{ fontSize: "13px", color: "var(--text-muted)", marginTop: "12px", lineHeight: "1.4" }}>
                    {t.bio}
                  </p>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {adminTab === "attendance" && (
        <div className="card">
          <h2>Session Roster & Attendance Tracking</h2>
          <p className="card-desc">Select a class to inspect registered member details and record attendance.</p>

          <div className="form-group" style={{ maxWidth: "480px" }}>
            <label>Select Scheduled Session:</label>
            <select
              value={selectedSessionId}
              onChange={(e) => setSelectedSessionId(e.target.value)}
            >
              {sessions.map((s) => (
                <option key={s.id} value={s.id}>
                  {s.displayDate} · {s.startTime}-{s.endTime} · {s.title} ({s.location})
                </option>
              ))}
            </select>
          </div>

          {currentSession && (
            <div className="admin-summary-bar">
              <span>{currentSession.location} · Coach {currentSession.coach}</span>
              <span>{currentSession.bookedCount} / {currentSession.capacity} Booked ({currentSession.capacity - currentSession.bookedCount} slots available)</span>
            </div>
          )}

          <div className="attendance-counters">
            <span className="attendance-pill green">{presentCount} Present</span>
            <span className="attendance-pill red">{absentCount} Absent</span>
            <span className="attendance-pill">{notMarkedCount} Not Marked</span>
          </div>

          <div className="table-container">
            <table>
              <thead>
                <tr>
                  <th>Attendee Name</th>
                  <th>Contact Info</th>
                  <th>Ref Code</th>
                  <th>Special Notes</th>
                  <th>Status</th>
                  <th>Check-In Action</th>
                </tr>
              </thead>
              <tbody>
                {sessionAttendees.length === 0 ? (
                  <tr>
                    <td colSpan="6" style={{ textAlign: "center", padding: "28px", color: "var(--text-muted)" }}>
                      No members currently registered for this session slot.
                    </td>
                  </tr>
                ) : (
                  sessionAttendees.map((m) => (
                    <tr key={m.id}>
                      <td>
                        <div className="cell-primary">{m.userName}</div>
                      </td>
                      <td>
                        <div className="cell-sub">{m.userEmail}</div>
                        <div className="cell-sub">{m.userPhone}</div>
                      </td>
                      <td>
                        <span className="badge badge-outline">{m.bookingCode}</span>
                      </td>
                      <td style={{ maxWidth: "200px", fontSize: "12px", color: "var(--text-muted)" }}>
                        {m.notes || "—"}
                      </td>
                      <td>
                        <span
                          className={`badge ${
                            m.attendance === "Present"
                              ? "badge-green"
                              : m.attendance === "Absent"
                              ? "badge-red"
                              : ""
                          }`}
                        >
                          {m.attendance || "Not marked"}
                        </span>
                      </td>
                      <td>
                        <div className="attendance-btn-group">
                          <button
                            type="button"
                            className={`attendance-btn ${m.attendance === "Present" ? "selected-present" : ""}`}
                            onClick={() => onMarkAttendance(m.id, "Present")}
                          >
                            Present
                          </button>
                          <button
                            type="button"
                            className={`attendance-btn ${m.attendance === "Absent" ? "selected-absent" : ""}`}
                            onClick={() => onMarkAttendance(m.id, "Absent")}
                          >
                            Absent
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {adminTab === "bookings" && (
        <div className="card">
          <h2>Master Member Bookings Log</h2>
          <p className="card-desc">All reserved classes recorded across members with contact details.</p>

          <div className="table-container">
            <table>
              <thead>
                <tr>
                  <th>Booking Code</th>
                  <th>Member Name</th>
                  <th>Email & Phone</th>
                  <th>Class & Coach</th>
                  <th>Date & Time</th>
                  <th>Health Notes</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {allBookings.map((b) => (
                  <tr key={b.id}>
                    <td>
                      <span className="badge badge-outline">{b.bookingCode}</span>
                    </td>
                    <td className="cell-primary">{b.userName}</td>
                    <td>
                      <div className="cell-sub">{b.userEmail}</div>
                      <div className="cell-sub">{b.userPhone}</div>
                    </td>
                    <td>
                      <div className="cell-primary">{b.title}</div>
                      <div className="cell-sub">Coach {b.coach} · {b.location}</div>
                    </td>
                    <td>
                      <div className="cell-primary">{b.fullDate}</div>
                      <div className="cell-sub">{b.startTime} - {b.endTime}</div>
                    </td>
                    <td style={{ maxWidth: "200px", fontSize: "12px", color: "var(--text-muted)" }}>
                      {b.notes || "None"}
                    </td>
                    <td>
                      <span className={`badge ${b.status === "Confirmed" ? "badge-green" : "badge-red"}`}>
                        {b.status}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {adminTab === "create-session" && (
        <div className="card" style={{ maxWidth: "600px" }}>
          <h2>Schedule New Studio Session</h2>
          <p className="card-desc">Add a new class to the booking schedule.</p>

          <form onSubmit={handleCreateSessionSubmit}>
            <div className="form-group">
              <label>Class Name</label>
              <input
                type="text"
                value={sessionTitle}
                onChange={(e) => setSessionTitle(e.target.value)}
                placeholder="e.g. Barbell Strength & Power"
                required
              />
            </div>

            <div className="form-row">
              <div className="form-group">
                <label>Date</label>
                <input
                  type="date"
                  value={sessionDate}
                  onChange={(e) => setSessionDate(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label>Category</label>
                <select value={sessionCategory} onChange={(e) => setSessionCategory(e.target.value)}>
                  <option value="Strength">Strength</option>
                  <option value="HIIT">HIIT</option>
                  <option value="Yoga">Yoga</option>
                  <option value="Cycling">Cycling</option>
                  <option value="Recovery">Recovery</option>
                </select>
              </div>
            </div>

            <div className="form-row">
              <div className="form-group">
                <label>Start Time</label>
                <input
                  type="text"
                  value={sessionStart}
                  onChange={(e) => setSessionStart(e.target.value)}
                  placeholder="18:00"
                  required
                />
              </div>
              <div className="form-group">
                <label>End Time</label>
                <input
                  type="text"
                  value={sessionEnd}
                  onChange={(e) => setSessionEnd(e.target.value)}
                  placeholder="19:00"
                  required
                />
              </div>
            </div>

            <div className="form-row">
              <div className="form-group">
                <label>Coach Assigned</label>
                <select value={sessionCoach} onChange={(e) => setSessionCoach(e.target.value)}>
                  {trainers.map((t) => (
                    <option key={t.id} value={t.name}>
                      {t.name} ({t.specialty})
                    </option>
                  ))}
                </select>
              </div>

              <div className="form-group">
                <label>Studio Room</label>
                <select value={sessionLocation} onChange={(e) => setSessionLocation(e.target.value)}>
                  <option value="Studio A">Studio A (Main Weight Room)</option>
                  <option value="Studio B">Studio B (HIIT & Conditioning)</option>
                  <option value="Cycle Studio">Cycle Studio</option>
                  <option value="Recovery Studio">Recovery Studio</option>
                </select>
              </div>
            </div>

            <div className="form-group">
              <label>Max Slot Capacity</label>
              <input
                type="number"
                min="1"
                max="50"
                value={sessionCapacity}
                onChange={(e) => setSessionCapacity(e.target.value)}
                required
              />
            </div>

            <button type="submit" className="btn btn-primary btn-wide">
              Publish Class to Live Schedule
            </button>
          </form>
        </div>
      )}
    </div>
  );
}

function Footer() {
  return (
    <footer className="site-footer">
      <div className="footer-inner">
        <div>
          <strong>PULSE ATHLETICS</strong> &middot; 428 Ironworks Way &middot; Certified Training Facility
        </div>
        <div>Member Inquiries: support@pulseathletics.com</div>
      </div>
    </footer>
  );
}

function formatDisplayDate(dateStr) {
  if (!dateStr) return "Thu, 22 Oct";
  const [y, m, d] = dateStr.split("-");
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
  const dayName = days[dateObj.getDay()] || "Thu";
  const monthName = months[dateObj.getMonth()] || "Oct";
  return `${dayName}, ${Number(d)} ${monthName}`;
}

const rootElement = document.getElementById("root");
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}
  </script>
